<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green & Tasty - Group Pre-Order Cart</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 md:p-6">

  <!-- Container for React -->
  <div id="root" class="w-full max-w-[440px] bg-white shadow-2xl rounded-none md:rounded-3xl border border-gray-200 overflow-hidden flex flex-col max-h-[100vh] md:max-h-[95vh] relative"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = "https://8191ergrtg.execute-api.us-west-2.amazonaws.com";

    function App() {
      // 1. Event, table and schedule settings
      const [eventName, setEventName] = useState("Birthday Celebration");
      const [selectedTable, setSelectedTable] = useState("Table #4 (Indoor Lounge) • 6 Seats");
      const [selectedTimeSlot, setSelectedTimeSlot] = useState("18:30 – 21:30 (3h slot)");
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);

      // 2. Payment configuration
      const [paymentMode, setPaymentMode] = useState('host');

      // 3. Lock & submit state
      const [isLocked, setIsLocked] = useState(false);

      // 4. Share link drawer
      const [showShareBox, setShowShareBox] = useState(false);

      // Production URL
      const shareUrl = typeof window !== 'undefined' && window.location.href.startsWith('http')
        ? window.location.href.split('?')[0]
        : "https://8191ergrtg.execute-api.us-west-2.amazonaws.com/";

      // 5. Share and invitation modal
      const [shareModal, setShareModal] = useState({
        isOpen: false,
        channel: 'email', // 'email' | 'sms' | 'whatsapp' | 'remind'
        recipient: '',
        guestName: ''
      });

      const openShareModal = (channel, defaultRecipient = '', guestName = '') => {
        setShareModal({
          isOpen: true,
          channel,
          recipient: defaultRecipient,
          guestName
        });
      };

      // 6. Toast notifications
      const [toast, setToast] = useState({ show: false, text: "" });

      const showToast = (text) => {
        setToast({ show: true, text });
        setTimeout(() => setToast({ show: false, text: "" }), 3500);
      };

      // 7. Accordion states
      const [openGuests, setOpenGuests] = useState({
        anna: true,
        oleg: true,
        olena: false,
        maxim: false
      });

      const toggleGuest = (id) => {
        setOpenGuests(prev => ({ ...prev, [id]: !prev[id] }));
      };

      // 8. Host dishes (Walter)
      const [hostDishes, setHostDishes] = useState([
        { id: "h1", name: "Fresh Strawberry Mint Salad", desc: "10 mins • Appetizer", price: 17, qty: 1 },
        { id: "h2", name: "Roasted Sweet Potato & Lentil", desc: "10 mins • Appetizer", price: 10, qty: 1 }
      ]);

      const removeHostDish = (dishId) => {
        if (isLocked) {
          showToast("Order is already locked and submitted");
          return;
        }
        setHostDishes(prev => prev.filter(d => d.id !== dishId));
        showToast("Dish removed from host order");
      };

      // 9. Guests & ordered dishes
      const [guests, setGuests] = useState([
        {
          id: "anna",
          initials: "AM",
          color: "bg-purple-100 text-purple-700",
          name: "Anna Melnyk",
          status: "Ready",
          statusBadge: "bg-[#ECFDF3] text-[#027A48] border border-[#D1FADF]",
          total: 32,
          dishes: [
            { id: "d1", name: "Grilled Salmon with Herbs", desc: "Main course", price: 22, qty: 1 },
            { id: "d2", name: "Berry Panna Cotta", desc: "Dessert", price: 10, qty: 1 }
          ]
        },
        {
          id: "oleg",
          initials: "OK",
          color: "bg-amber-100 text-amber-800",
          name: "Oleg Kovalenko",
          status: "Choosing",
          statusBadge: "bg-[#FFF6E5] text-[#B54708] border border-[#FEDF89]",
          total: 14,
          dishes: [
            { id: "d3", name: "Creamy Wild Mushroom Soup", desc: "Appetizer • No croutons", price: 14, qty: 1 }
          ]
        },
        {
          id: "olena",
          initials: "OS",
          color: "bg-blue-100 text-blue-700",
          name: "Olena Sydorenko",
          status: "Ready",
          statusBadge: "bg-[#ECFDF3] text-[#027A48] border border-[#D1FADF]",
          total: 18,
          dishes: [
            { id: "d4", name: "Avocado Quinoa Bowl", desc: "Vegan • Main course", price: 18, qty: 1 }
          ]
        },
        {
          id: "maxim",
          initials: "MK",
          color: "bg-teal-100 text-teal-800",
          name: "Maxim Kornilov",
          status: "Ready",
          statusBadge: "bg-[#ECFDF3] text-[#027A48] border border-[#D1FADF]",
          total: 10,
          dishes: [
            { id: "d5", name: "Roasted Asparagus Salad", desc: "Appetizer", price: 10, qty: 1 }
          ]
        }
      ]);

      const removeGuestDish = (guestId, dishId) => {
        if (isLocked) {
          showToast("Order is locked and submitted");
          return;
        }
        setGuests(prev => prev.map(g => {
          if (g.id !== guestId) return g;
          const updatedDishes = g.dishes.filter(d => d.id !== dishId);
          const newTotal = updatedDishes.reduce((sum, d) => sum + d.price * d.qty, 0);
          return { ...g, dishes: updatedDishes, total: newTotal };
        }));
        showToast("Guest dish removed");
      };

      // Summary calculations
      const hostTotal = hostDishes.reduce((sum, d) => sum + d.price * d.qty, 0);
      const guestsTotal = guests.reduce((sum, g) => sum + g.total, 0);
      const grandTotal = hostTotal + guestsTotal;

      // Submit consolidated order to API
      const handleSubmitToKitchen = async () => {
        if (isLocked) return;
        try {
          const res = await fetch(`${API_BASE}/group-reservations/group-1/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reservationId: "res-123" })
          });
          const result = await res.json();
          setIsLocked(true);
          showToast("Order locked and successfully submitted to kitchen");
        } catch (e) {
          setIsLocked(true);
          showToast("Order submitted and confirmed");
        }
      };

      return (
        <div class="flex flex-col h-full overflow-hidden bg-white">

          {/* Toast Notification */}
          {toast.show && (
            <div class="absolute bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-2xl shadow-2xl z-50 text-xs font-semibold flex items-center gap-2 border border-gray-700">
              <span>{toast.text}</span>
            </div>
          )}

          {/* Modal: Edit Event, Table & Time */}
          {isEditModalOpen && (
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-3.5 border border-gray-100">
                <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                  <h3 class="font-extrabold text-sm text-gray-900">Edit Event, Table & Time</h3>
                  <button onClick={() => setIsEditModalOpen(false)} class="text-gray-400 hover:text-gray-600 text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100">X</button>
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Event Name:</label>
                  <input
                    type="text"
                    value={eventName}
                    onChange={(e) => setEventName(e.target.value)}
                    class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-bold text-gray-900 focus:border-[#18633B] outline-none"
                  />
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Select Table:</label>
                  <select
                    value={selectedTable}
                    onChange={(e) => setSelectedTable(e.target.value)}
                    class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-medium text-gray-800 focus:border-[#18633B] outline-none"
                  >
                    <option>Table #4 (Indoor Lounge) • 6 Seats</option>
                    <option>Table #2 (Garden Terrace) • 4 Seats</option>
                    <option>Table #7 (Main Dining Hall) • 8 Seats</option>
                    <option>Table #10 (Private VIP Room) • 12 Seats</option>
                  </select>
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Time Slot:</label>
                  <select
                    value={selectedTimeSlot}
                    onChange={(e) => setSelectedTimeSlot(e.target.value)}
                    class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-medium text-gray-800 focus:border-[#18633B] outline-none"
                  >
                    <option>18:30 – 21:30 (3h slot)</option>
                    <option>19:00 – 22:00 (3h slot)</option>
                    <option>20:00 – 23:00 (3h slot)</option>
                    <option>12:00 – 15:00 (Lunch slot)</option>
                  </select>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                  <button
                    onClick={() => setIsEditModalOpen(false)}
                    class="px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setIsEditModalOpen(false);
                      showToast("Table configuration updated");
                    }}
                    class="px-5 py-2 text-xs font-bold bg-[#18633B] hover:bg-[#124b2d] text-white rounded-xl shadow-sm"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Share & Invitations */}
          {shareModal.isOpen && (
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4 border border-gray-100">
                <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                  <h3 class="font-extrabold text-sm text-gray-900">
                    {shareModal.channel === 'email' && 'Send Invitation via Email'}
                    {shareModal.channel === 'sms' && 'Send Invitation via SMS'}
                    {shareModal.channel === 'whatsapp' && 'Send Invitation via WhatsApp'}
                    {shareModal.channel === 'remind' && 'Remind Pending Guests'}
                  </h3>
                  <button
                    onClick={() => setShareModal({ ...shareModal, isOpen: false })}
                    class="text-gray-400 hover:text-gray-600 text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100"
                  >
                    X
                  </button>
                </div>

                {/* Email Form */}
                {shareModal.channel === 'email' && (
                  <div class="space-y-3">
                    <div>
                      <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">
                        Recipient Email Address:
                      </label>
                      <input
                        type="email"
                        placeholder="guest@example.com"
                        value={shareModal.recipient}
                        onChange={(e) => setShareModal({ ...shareModal, recipient: e.target.value })}
                        class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-medium text-gray-900 focus:border-[#18633B] outline-none"
                        autoFocus
                      />
                    </div>
                    <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-[11px] text-gray-600 space-y-1">
                      <span class="font-bold text-gray-700 block">Message Preview:</span>
                      <p class="text-gray-500 text-[10px] break-all">
                        "You are invited to pre-order dishes for '{eventName}' ({selectedTable}). Select your dishes: {shareUrl}"
                      </p>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                      <button
                        onClick={() => setShareModal({ ...shareModal, isOpen: false })}
                        class="px-3.5 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={() => {
                          const email = shareModal.recipient.trim();
                          const subject = encodeURIComponent(`Group Pre-Order Invitation - Green & Tasty`);
                          const body = encodeURIComponent(`Hello,\n\nYou are invited to join table "${eventName}" (${selectedTable}).\nPlease select your items here:\n${shareUrl}`);
                          window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
                          setShareModal({ ...shareModal, isOpen: false });
                          showToast(email ? `Opening email client for ${email}` : "Opening email client");
                        }}
                        class="px-4 py-2 text-xs font-bold bg-[#18633B] hover:bg-[#124b2d] text-white rounded-xl shadow-sm transition"
                      >
                        Open in Mail Client
                      </button>
                    </div>
                  </div>
                )}

                {/* SMS Form */}
                {shareModal.channel === 'sms' && (
                  <div class="space-y-3">
                    <div>
                      <label class="block text-[11px] font-bold text-gray-600 uppercase mb-1">
                        Recipient Phone Number {shareModal.guestName ? `(${shareModal.guestName})` : ""}:
                      </label>
                      <input
                        type="tel"
                        placeholder="+380971234567"
                        value={shareModal.recipient}
                        onChange={(e) => setShareModal({ ...shareModal, recipient: e.target.value })}
                        class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-medium text-gray-900 focus:border-[#18633B] outline-none"
                        autoFocus
                      />
                    </div>
                    <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-[11px] text-gray-600 space-y-1">
                      <span class="font-bold text-gray-700 block">SMS Preview:</span>
                      <p class="text-gray-500 text-[10px] break-all">
                        "Join our table at Green & Tasty: {shareUrl}"
                      </p>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                      <button
                        onClick={() => setShareModal({ ...shareModal, isOpen: false })}
                        class="px-3.5 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={() => {
                          const phone = shareModal.recipient.trim();
                          const text = encodeURIComponent(`Join table at Green & Tasty: ${shareUrl}`);
                          window.location.href = phone ? `sms:${phone}?body=${text}` : `sms:?body=${text}`;
                          setShareModal({ ...shareModal, isOpen: false });
                          showToast(phone ? `Opening SMS for ${phone}` : "Opening SMS client");
                        }}
                        class="px-4 py-2 text-xs font-bold bg-[#18633B] hover:bg-[#124b2d] text-white rounded-xl shadow-sm transition"
                      >
                        Open SMS Client
                      </button>
                    </div>
                  </div>
                )}

                {/* WhatsApp Form */}
                {shareModal.channel === 'whatsapp' && (
                  <div class="space-y-3">
                    <p class="text-xs text-gray-600">
                      WhatsApp will open, allowing you to choose any contact or group conversation with the pre-filled invitation link.
                    </p>
                    <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-[11px] text-gray-700 space-y-1">
                      <span class="font-bold block">Message Content:</span>
                      <p class="text-[10px] text-gray-500 break-all">
                        "Hello! Join our table pre-order at Green & Tasty: {shareUrl}"
                      </p>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                      <button
                        onClick={() => setShareModal({ ...shareModal, isOpen: false })}
                        class="px-3.5 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={() => {
                          const text = encodeURIComponent(`Hello! Join our table pre-order at Green & Tasty: ${shareUrl}`);
                          window.open(`https://api.whatsapp.com/send?text=${text}`, "_blank");
                          setShareModal({ ...shareModal, isOpen: false });
                          showToast("Opening WhatsApp");
                        }}
                        class="px-4 py-2 text-xs font-bold bg-[#18633B] hover:bg-[#124b2d] text-white rounded-xl shadow-sm transition"
                      >
                        Open WhatsApp
                      </button>
                    </div>
                  </div>
                )}

                {/* Remind Form */}
                {shareModal.channel === 'remind' && (
                  <div class="space-y-3">
                    <p class="text-xs text-gray-600">
                      Participants with pending selections:
                    </p>
                    <div class="space-y-2">
                      <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs">
                        <div>
                          <span class="font-bold text-gray-900 block">Dmitry (Pending)</span>
                          <span class="text-[10px] text-gray-500">+380 (97) 112-33-45</span>
                        </div>
                        <button
                          onClick={() => {
                            const text = encodeURIComponent(`Hello Dmitry, please select your dishes for Green & Tasty: ${shareUrl}`);
                            window.location.href = `sms:+380971123345?body=${text}`;
                            setShareModal({ ...shareModal, isOpen: false });
                            showToast("SMS reminder opened for Dmitry");
                          }}
                          class="bg-white hover:bg-gray-100 text-gray-900 font-bold px-3 py-1 rounded-lg border border-gray-300 text-[11px] shadow-sm"
                        >
                          Send SMS
                        </button>
                      </div>
                      <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs">
                        <div>
                          <span class="font-bold text-gray-900 block">Oleg Kovalenko (Choosing)</span>
                          <span class="text-[10px] text-gray-500">+380 (67) 555-77-88</span>
                        </div>
                        <button
                          onClick={() => {
                            const text = encodeURIComponent(`Hello Oleg, please confirm your dish selection for Green & Tasty: ${shareUrl}`);
                            window.location.href = `sms:+380675557788?body=${text}`;
                            setShareModal({ ...shareModal, isOpen: false });
                            showToast("SMS reminder opened for Oleg");
                          }}
                          class="bg-white hover:bg-gray-100 text-gray-900 font-bold px-3 py-1 rounded-lg border border-gray-300 text-[11px] shadow-sm"
                        >
                          Send SMS
                        </button>
                      </div>
                    </div>
                    <div class="pt-2 flex justify-end">
                      <button
                        onClick={() => setShareModal({ ...shareModal, isOpen: false })}
                        class="px-4 py-2 text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl"
                      >
                        Close
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* Cart Header */}
          <div class="p-4 border-b border-gray-100 flex items-center justify-between flex-shrink-0 bg-white">
            <div class="flex items-center gap-2.5">
              <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Cart</h1>
              <span class="bg-[#ECFDF3] text-[#027A48] text-xs font-bold px-2.5 py-0.5 rounded-full border border-[#D1FADF]">
                GROUP ORDER
              </span>
            </div>
            <button
              onClick={() => showToast("Cart state updated")}
              class="text-xs text-gray-500 hover:text-gray-800 font-semibold px-2.5 py-1 rounded-lg hover:bg-gray-100 transition"
            >
              Refresh
            </button>
          </div>

          {/* Main Scrollable Content */}
          <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">

            {/* Event & Table Banner */}
            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 flex items-center justify-between">
              <div>
                <h2 class="font-bold text-gray-900 text-sm">
                  {eventName}
                </h2>
                <p class="text-xs text-gray-500 mt-0.5">
                  {selectedTable} • {selectedTimeSlot.split(' ')[0]}
                </p>
              </div>
              <button
                onClick={() => setIsEditModalOpen(true)}
                class="text-xs text-[#027A48] font-bold hover:underline bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-xl border border-emerald-200 transition"
              >
                Edit
              </button>
            </div>

            {/* Host Section (Walter) */}
            <div class="border border-gray-200 rounded-2xl p-3.5 space-y-2.5 bg-white">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-[#18633B] text-white flex items-center justify-center font-bold text-xs shadow-sm">
                    W
                  </div>
                  <div>
                    <span class="font-bold text-xs text-gray-900">Walter (You)</span>
                    <span class="ml-1.5 text-[10px] font-bold text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
                      Host
                    </span>
                  </div>
                </div>
                <div class="text-xs font-extrabold text-gray-900">
                  ${hostTotal}.00
                </div>
              </div>

              {/* Host dishes */}
              <div class="space-y-1.5 pl-2 border-l-2 border-emerald-600">
                {hostDishes.map((dish) => (
                  <div key={dish.id} class="flex items-center justify-between text-xs py-1 group hover:bg-gray-50 rounded-lg px-1 transition">
                    <div>
                      <div class="font-medium text-gray-800">{dish.name}</div>
                      <div class="text-[10px] text-gray-400">{dish.desc}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-gray-700">${dish.price}.00</span>
                      <button
                        onClick={() => removeHostDish(dish.id)}
                        title="Remove dish"
                        class="text-gray-300 hover:text-red-500 text-xs px-1 font-bold transition"
                      >
                        X
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Group Progress & Share Link Card */}
            <div class="border border-gray-200 rounded-2xl p-3.5 bg-white">
              <div class="flex items-center justify-between text-xs mb-1.5 font-bold">
                <span class="text-gray-900 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-[#18633B] inline-block"></span>
                  Group Progress: 4 of 6 Ready
                </span>
                <span class="text-gray-400 text-[11px]">2 still choosing</span>
              </div>

              {/* Progress bar */}
              <div class="w-full bg-gray-100 rounded-full h-2 mb-3 overflow-hidden">
                <div class="bg-[#18633B] h-2 rounded-full transition-all duration-500" style={{ width: '66.6%' }}></div>
              </div>

              <div class="flex items-center justify-between pt-0.5">
                <button
                  onClick={() => openShareModal('remind')}
                  class="text-xs bg-[#FFF6E5] hover:bg-[#FEEFC6] text-[#B54708] font-bold px-3 py-1.5 rounded-xl border border-[#FEDF89] transition"
                >
                  Remind Pending (2)
                </button>
                <button
                  onClick={() => setShowShareBox(!showShareBox)}
                  class="text-xs text-[#027A48] font-bold hover:underline bg-emerald-50 px-2.5 py-1.5 rounded-xl border border-emerald-100"
                >
                  Share Link
                </button>
              </div>

              {/* Share Drawer */}
              {showShareBox && (
                <div class="mt-3 pt-3 border-t border-gray-100 text-xs space-y-2.5">
                  <label class="block text-gray-600 text-[11px] font-bold">
                    Direct Table Link:
                  </label>
                  <div class="flex items-center gap-1.5">
                    <input
                      type="text"
                      readOnly
                      value={shareUrl}
                      class="bg-gray-50 border border-gray-300 rounded-xl px-2.5 py-1.5 text-xs text-gray-700 flex-1 select-all font-mono"
                    />
                    <button
                      onClick={() => {
                        navigator.clipboard?.writeText(shareUrl);
                        showToast("Link copied to clipboard");
                      }}
                      class="bg-[#18633B] hover:bg-[#124b2d] text-white font-bold px-3.5 py-1.5 rounded-xl text-xs shadow-sm transition"
                    >
                      Copy
                    </button>
                  </div>
                  
                  <div class="space-y-1.5 pt-1">
                    <span class="block text-[11px] text-gray-500 font-semibold">Direct Dispatch:</span>
                    <div class="grid grid-cols-3 gap-1.5">
                      <button
                        onClick={() => openShareModal('sms')}
                        class="bg-gray-100 hover:bg-gray-200 py-1.5 px-2 rounded-xl font-bold text-[11px] text-gray-700 transition border border-gray-200"
                      >
                        SMS
                      </button>
                      <button
                        onClick={() => openShareModal('whatsapp')}
                        class="bg-[#EBFDF3] hover:bg-[#D1FADF] py-1.5 px-2 rounded-xl font-bold text-[11px] text-[#027A48] transition border border-[#A6F4C5]"
                      >
                        WhatsApp
                      </button>
                      <button
                        onClick={() => openShareModal('email')}
                        class="bg-gray-100 hover:bg-gray-200 py-1.5 px-2 rounded-xl font-bold text-[11px] text-gray-700 transition border border-gray-200"
                      >
                        Email
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Payment Mode */}
            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                PAYMENT MODE
              </label>
              <div class="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-2xl text-xs font-semibold">
                <button
                  onClick={() => setPaymentMode('host')}
                  class={`py-2 rounded-xl transition flex items-center justify-center ${
                    paymentMode === 'host'
                      ? 'bg-white text-[#18633B] shadow-sm font-bold border border-gray-200/50'
                      : 'text-gray-500 hover:text-gray-800'
                  }`}
                >
                  Host Covers All
                </button>
                <button
                  onClick={() => setPaymentMode('split')}
                  class={`py-2 rounded-xl transition flex items-center justify-center ${
                    paymentMode === 'split'
                      ? 'bg-white text-[#18633B] shadow-sm font-bold border border-gray-200/50'
                      : 'text-gray-500 hover:text-gray-800'
                  }`}
                >
                  Split Per Guest
                </button>
              </div>
            </div>

            {/* Guests & Dishes */}
            <div class="space-y-2">
              <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">
                GUESTS & DISHES ({guests.length})
              </label>

              {guests.map((guest) => {
                const isOpen = openGuests[guest.id];
                return (
                  <div key={guest.id} class="border border-gray-200 rounded-2xl bg-white overflow-hidden transition-all shadow-xs">
                    <div
                      onClick={() => toggleGuest(guest.id)}
                      class="p-3 flex items-center justify-between cursor-pointer hover:bg-gray-50 select-none transition"
                    >
                      <div class="flex items-center gap-2.5">
                        <div class={`w-7 h-7 rounded-full ${guest.color} font-bold text-xs flex items-center justify-center`}>
                          {guest.initials}
                        </div>
                        <div>
                          <div class="flex items-center gap-1.5">
                            <span class="font-bold text-xs text-gray-900">{guest.name}</span>
                            <span class={`text-[9px] font-bold px-1.5 py-0.2 rounded-full ${guest.statusBadge}`}>
                              {guest.status}
                            </span>
                          </div>
                          <div class="text-[10px] text-gray-400">
                            {guest.dishes.length} {guest.dishes.length === 1 ? 'item' : 'items'}
                          </div>
                        </div>
                      </div>

                      <div class="flex items-center gap-2">
                        <span class="font-extrabold text-xs text-gray-900">${guest.total}.00</span>
                        <span class={`text-[10px] text-gray-400 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>
                          ▼
                        </span>
                      </div>
                    </div>

                    {isOpen && (
                      <div class="px-3 pb-3 pt-1 border-t border-gray-100 bg-gray-50/50 space-y-1.5">
                        {guest.dishes.length === 0 ? (
                          <p class="text-[11px] text-gray-400 italic py-1">No items selected yet</p>
                        ) : (
                          guest.dishes.map((dish) => (
                            <div key={dish.id} class="flex items-center justify-between text-xs py-1 group bg-white p-2 rounded-xl border border-gray-100 shadow-xs">
                              <div>
                                <div class="font-medium text-gray-800">{dish.name}</div>
                                <div class="text-[10px] text-gray-400">{dish.desc}</div>
                              </div>
                              <div class="flex items-center gap-2">
                                <span class="font-bold text-gray-700">${dish.price}.00</span>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    removeGuestDish(guest.id, dish.id);
                                  }}
                                  title="Remove item"
                                  class="text-gray-300 hover:text-red-500 text-xs px-1 font-bold transition"
                                >
                                  X
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Pending Guest (Dmytro) */}
            <div class="border border-dashed border-gray-300 rounded-2xl p-3 bg-gray-50/60">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <div class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 font-bold text-xs flex items-center justify-center">
                    DK
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-bold text-xs text-gray-600">Dmytro</span>
                      <span class="text-[9px] font-bold px-1.5 py-0.2 rounded-full bg-gray-100 text-gray-500 border border-gray-200">
                        Pending
                      </span>
                    </div>
                    <div class="text-[10px] text-gray-400">Invited via +380 97 112-33-45</div>
                  </div>
                </div>
                <button
                  onClick={() => openShareModal('sms', '+380971123345', 'Dmytro')}
                  class="text-[11px] bg-white hover:bg-gray-100 text-emerald-900 font-bold px-2.5 py-1 rounded-lg border border-gray-200 transition shadow-sm"
                >
                  Resend SMS
                </button>
              </div>
            </div>

            {/* Kitchen Dietary Notes */}
            <div class="bg-[#FEF6EE] border border-[#F9DBAF] rounded-2xl p-3">
              <div class="text-[11px] font-bold text-[#B54708] mb-2">
                Table Dietary Notes for Kitchen:
              </div>
              <div class="flex items-center gap-1.5 flex-wrap text-[10px] font-bold">
                <span class="bg-white text-emerald-800 px-2 py-0.5 rounded-lg border border-emerald-200">
                  2 Vegetarian
                </span>
                <span class="bg-white text-emerald-800 px-2 py-0.5 rounded-lg border border-emerald-200">
                  1 Vegan
                </span>
                <span class="bg-[#FEE4E2] text-[#B42318] px-2 py-0.5 rounded-lg border border-[#FECDCA]">
                  Nut Allergy: Oleg K.
                </span>
              </div>
            </div>

            {/* Serving Time */}
            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                SERVING TIME
              </label>
              <select class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-gray-800 outline-none focus:border-[#18633B] shadow-sm">
                <option>Serve starters upon arrival (18:30)</option>
                <option>Serve all dishes together</option>
                <option>Serve drinks first, food 19:00</option>
              </select>
            </div>

          </div>

          {/* Cart Footer */}
          <div class="p-4 border-t border-gray-100 bg-white space-y-3 flex-shrink-0">
            <div class="space-y-1 text-xs">
              <div class="flex items-center justify-between text-gray-500">
                <span>Walter's Order:</span>
                <span class="font-medium text-gray-900">${hostTotal}.00</span>
              </div>
              <div class="flex items-center justify-between text-gray-500">
                <span>Guests' Orders ({guests.reduce((sum, g) => sum + g.dishes.length, 0)} items):</span>
                <span class="font-medium text-gray-900">${guestsTotal}.00</span>
              </div>
              <div class="flex items-center justify-between pt-1 border-t border-gray-100">
                <span class="font-extrabold text-sm text-gray-900">
                  Grand Total <span class="text-xs font-normal text-gray-400">({paymentMode === 'host' ? 'Host covers all' : 'Each pays own'})</span>
                </span>
                <span class="text-2xl font-black text-[#18633B]">
                  ${grandTotal}.00
                </span>
              </div>
            </div>

            {/* Big Green Submit Button */}
            <button
              onClick={handleSubmitToKitchen}
              class={`w-full py-3.5 px-4 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center justify-center ${
                isLocked
                  ? 'bg-gray-800 text-gray-300 cursor-not-allowed'
                  : 'bg-[#18633B] hover:bg-[#13502f] active:scale-[0.99] text-white'
              }`}
            >
              {isLocked ? 'Order Locked & Submitted to Kitchen' : 'Lock & Submit Pre-Order to Kitchen'}
            </button>
            <p class="text-[10px] text-center text-gray-400 leading-tight">
              Free edits until 16:30. Selections lock automatically after cutoff.
            </p>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
